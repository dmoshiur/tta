services:
  - type: web
    name: thinktank-academia
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Turso (libsql/SQLite) database — create it at https://turso.io
      # (Render's managed PostgreSQL is no longer used).
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: HACKER_ADMIN_EMAIL
        sync: false
      - key: HACKER_ADMIN_PASSCODE_TTL_MINUTES
        value: "60"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Media storage — the project's own Storage Gateway (NGO File Cloud bridge).
      # Set the key id/secret in the Render dashboard; never commit them.
      - key: STORAGE_DRIVER
        value: gateway
      - key: STORAGE_GATEWAY_URL
        value: https://st.thamjj13.top/api/v1
      - key: STORAGE_GATEWAY_KEY_ID
        sync: false
      - key: STORAGE_GATEWAY_KEY_SECRET
        sync: false
